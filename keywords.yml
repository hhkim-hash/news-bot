# ============================================================
# 뉴스 클리핑 키워드 설정
# ============================================================
# ✏️ 처음 쓰는 분은 맨 위 "내 브랜드" 3개만 바꿔도 바로 쓸 수 있습니다.
#    나머지 카테고리(경쟁사·트렌드)는 예시(K-뷰티)이니 필요 없으면 통째로 지우세요.
#
# 카테고리별로 키워드를 관리합니다.
# display:      카테고리 표시명 (Slack 메시지에 사용)
# keywords:     검색어 목록 (한국어: 네이버 + Google News KR / 영어: Google News US)
# lang:         "en" 지정 시 미국 영어 뉴스만 검색 (영미권 PR 모니터링용)
# max_articles: 카테고리별 최대 전송 건수 (미지정 시 settings 값 사용)
# always_show:  true면 기사 0건이어도 "없음"으로 표시 (일일 확인용)
# competitor:   true면 이 카테고리 기사를 Jev로 판단 (이퀄베리 유리/불리 라벨 + 심층·기획·칼럼 제외)
#               이 카테고리의 검색 키워드가 곧 "경쟁사명"으로 Jev에 전달됨
# competitor_exclude: competitor 카테고리 안에서 경쟁사 브랜드가 아닌 키워드 (Jev 판단 제외)
# ============================================================

categories:

  # ============================================================
  # ✏️ 내 브랜드 — 여기를 내 회사·브랜드·대표 이름으로 바꾸세요
  # ============================================================
  # - 브랜드마다 카테고리를 하나씩 둡니다. 개수는 자유(추가·삭제 가능).
  # - always_show: true → 기사가 0건이어도 "오늘 감지된 기사 없음"이 떠서 매일 확인이 됩니다.
  # - 흔한 이름(예: 브랜든)은 단독으로 쓰면 동명이인·배우 기사가 섞입니다.
  #   "회사명 + 브랜드명", "브랜드명 + 대표 제품"처럼 두 단어로 묶으세요.

  my_brand_1:
    display: "⭐ 이퀄베리"
    always_show: true
    keywords:
      - "이퀄베리"
      - "Eqqualberry"

  my_brand_2:
    display: "⭐ 부스터스"
    always_show: true
    keywords:
      - "부스터스 커머스"
      - "부스터스 브랜드"

  my_brand_3:
    display: "⭐ 브랜든"
    always_show: true
    keywords:
      - "부스터스 브랜든"
      - "브랜든 압축 파우치"
      - "브랜든 여행가방"

  # ---------- 영미권 PR 모니터링 (예시) ----------

  global_eqqualberry:
    display: "🇺🇸 Eqqualberry 글로벌 PR"
    lang: en
    priority: high
    always_show: true
    max_articles: 10
    keywords:
      - "eqqualberry"
      - "Eqqualberry skincare"
      - "Eqqualberry K-beauty"

  global_competitors:
    display: "🌐 글로벌 경쟁사 (영미권)"
    lang: en
    priority: high
    competitor: true
    max_articles: 10
    keywords:
      - "medicube"
      - "Dr.Melaxin"
      - "AUNA skincare"
      - "Beauty of Joseon"
      - "COSRX"
      - "Celimax"
      - "Laneige"
      - "SKIN1004"
      - "Dr.Althea"
      - "Biodance"
      - "PURITO"
      - "\"d'Alba\" skincare"   # 따옴표 없으면 이탈리아 Alba 지역 기사가 잡힘
      - "Torriden"
      - "numbuzin"
      - "Arencia"
      - "sungboon"

  global_deep:
    display: "🧭 글로벌 심층 & 트렌드 (영미권)"
    lang: en
    priority: high
    max_articles: 8
    keywords:
      - "K-Beauty"
