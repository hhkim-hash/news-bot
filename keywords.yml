      - "화장품 수출 동향"
      - "K뷰티 해외 진출"
      - "뷰티 플랫폼 전략"

  beauty_media:
    display: "📰 뷰티 전문 매체"
    priority: high
    keywords: []
    media_sources:
      filter_keywords:
        - "글로벌"
        - "스킨케어"
        - "K-뷰티"
      feeds:
        - name: "뷰티경제"
          url: "https://www.beautyeconomy.co.kr/rss/allArticle.xml"
        - name: "화장품신문(뷰티누리)"
