# ============================================================
# 뉴스 클리핑 키워드 설정
# ============================================================
# ✏️ 처음 쓰는 분은 맨 위 "내 브랜드" 3개만 바꿔도 바로 쓸 수 있습니다.
#    나머지 카테고리(경쟁사·트렌드)는 예시(K-뷰티)이니 필요 없으면 통째로 지우세요.
#
# 카테고리별로 키워드를 관리합니다.
# display:      카테고리 표시명 (Slack 메시지에 사용)
# keywords:     검색어 목록 (한국어: 네이버 + Google News KR / 영어: Google News US)
# lang:         "en" 지정 시 미국 영어 뉴스만 검색 (영미권 PR 모니터링용)
# max_articles: 카테고리별 최대 전송 건수 (미지정 시 settings 값 사용)
# always_show:  true면 기사 0건이어도 "없음"으로 표시 (일일 확인용)
# competitor:   true면 이 카테고리 기사를 Jev로 판단 (이퀄베리 유리/불리 라벨 + 심층·기획·칼럼 제외)
#               이 카테고리의 검색 키워드가 곧 "경쟁사명"으로 Jev에 전달됨
# competitor_exclude: competitor 카테고리 안에서 경쟁사 브랜드가 아닌 키워드 (Jev 판단 제외)
# ============================================================

categories:

  # ============================================================
  # ✏️ 내 브랜드 — 여기를 내 회사·브랜드·대표 이름으로 바꾸세요
  # ============================================================
  # - 브랜드마다 카테고리를 하나씩 둡니다. 개수는 자유(추가·삭제 가능).
  # - always_show: true → 기사가 0건이어도 "오늘 감지된 기사 없음"이 떠서 매일 확인이 됩니다.
  # - 흔한 이름(예: 브랜든)은 단독으로 쓰면 동명이인·배우 기사가 섞입니다.
  #   "회사명 + 브랜드명", "브랜드명 + 대표 제품"처럼 두 단어로 묶으세요.

  my_brand_1:
    display: "⭐ 브랜든 부스터스"
    always_show: true
    keywords:
      - "부스터스 브랜든"
      - "브랜든 가방"
      - "브랜든 세이프"

  global_brand:
    display: "🇺🇸 Branden 글로벌 PR"
    lang: en
    always_show: true
    keywords:
      - "branden bag"
      - "branden travel"

  competitors:
    display: "🏢 경쟁사"
    competitor: true
    keywords:
      - "리드볼트"
      - "프랑떼"
      - "코지앤코"
      - "올리빙"
      - "생활공작소"
      - "샘소나이트"
      - "아메리칸투어리스터"
      - "내셔널지오그래픽 캐리어"

  industry_trend:
    display: "🔍 업계 트렌드"
    keywords:
      - "도난 방지 가방"
      - "세이프 가방"
      - "여행 파우치"
      - "여행용 캐리어"
      - "여행용품"

# ============================================================
# 수집 설정
# ============================================================
settings:
  display_per_keyword: 3        # 키워드당 수집 기사 수
  min_score_to_include: 3       # Slack 전송 최소 중요도 점수 (1-5)
  max_articles_per_category: 5  # 카테고리당 최대 전송 기사 수
  dedup_enabled: true           # 중복 기사 제거 여부
  # 채널2(SLACK_WEBHOOK_URL_2)에 보낼 카테고리. 비우면 채널1과 동일하게 전체 전송
  # 예) 글로벌 3개만 보내려면: [global_eqqualberry, global_competitors, global_deep]
  channel2_categories: []
