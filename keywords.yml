  # ---------- 국내 (예시) ----------

  global_kbeauty:
    display: "🌏 글로벌 K뷰티 성장 기업"
    priority: high
    competitor: true
    competitor_exclude:      # 브랜드가 아닌 키워드 (기관/인물 등)
      - "KOTRA K뷰티"
      - "KYYB"
      - "노정석"
    keywords:
      - "달바글로벌"
      - "에이피알"
      - "메디큐브"
      - "클리오"
      - "코스알엑스"
      - "아누아"
      - "라운드랩"
      - "토리든"
      - "바이오던스"
      - "닥터멜락신"
      - "닥터엘시아"
      - "마녀공장"
      - "비플레인"
      - "셀리맥스"
      - "구다이글로벌"
      - "조선미녀"
      - "스킨1004"
      - "티르티르"
      - "닥터자르트"
      - "넘버즈인"
      - "닥터지"
      - "KOTRA K뷰티"
      - "KYYB"
      - "노정석"

  major_beauty:
    display: "🏢 대형 뷰티 기업"
    priority: medium
    keywords:
      - "아모레퍼시픽"
