# ============================================================
# 수집 설정
# ============================================================
settings:
  display_per_keyword: 3        # 키워드당 수집 기사 수
  min_score_to_include: 3       # Slack 전송 최소 중요도 점수 (1-5)
  max_articles_per_category: 5  # 카테고리당 최대 전송 기사 수
  dedup_enabled: true           # 중복 기사 제거 여부
  # 채널2(SLACK_WEBHOOK_URL_2)에 보낼 카테고리. 비우면 채널1과 동일하게 전체 전송
  # 예) 글로벌 3개만 보내려면: [global_eqqualberry, global_competitors, global_deep]
  channel2_categories: []
